<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#14532d">
<meta name="description" content="SENSES Coffee Roasters - pencatatan roasting dan stok green bean.">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="manifest" href="./manifest.webmanifest">
<link rel="icon" href="./icons/icon-192.png">
<link rel="apple-touch-icon" href="./icons/icon-192.png">
<title>SENSES Coffee Roasters</title>
<style>
:root{color-scheme:light;--green:#14532d;--pale:#edf4ed}
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;font-family:Arial,sans-serif;background:var(--pale)}
.top{height:58px;display:flex;align-items:center;gap:10px;padding:6px 14px;background:var(--green);color:#fff;box-shadow:0 2px 8px #0002;position:relative;z-index:2}
.top img{width:42px;height:42px;border-radius:7px;object-fit:contain}.brand{font-weight:700;font-size:15px;line-height:1.2}.brand small{display:block;font-weight:400;font-size:11px;opacity:.85;margin-top:3px}
main{height:calc(100dvh - 58px);width:100%;}iframe{display:block;border:0;width:100%;height:100%;background:#f3f6f3}
#notice{position:absolute;z-index:3;left:12px;right:12px;top:70px;padding:12px 14px;background:#fff;border:1px solid #d4e4d4;border-radius:12px;box-shadow:0 4px 18px #0001;font-size:14px;color:#234b25}
</style>
</head><body>
<header class="top"><img src="./icons/icon-192.png" alt="Logo SENSES"><div class="brand">SENSES Coffee Roasters<small>Roasting &amp; Green Bean Stock</small></div></header>
<div id="notice">Memuat aplikasi SENSES… Jika tidak tampil, pastikan perubahan Code.gs sudah di-deploy sebagai versi baru.</div>
<main><iframe id="app" title="Aplikasi SENSES" src="https://script.google.com/macros/s/AKfycbygVBLXxABJJF3UJlKcadWzkJ-F7z7UriR0geYBioEXFF3iuKYpxg46OVOhVI6--h7oqQ/exec" allow="clipboard-read; clipboard-write"></iframe></main>
<script>
if('serviceWorker' in navigator){window.addEventListener('load',()=>navigator.serviceWorker.register('./service-worker.js').catch(()=>{}));}
const notice=document.getElementById('notice');
// Load event does not guarantee that the embedded app rendered successfully; keep a short status message.
setTimeout(()=>{notice.style.display='none';},7000);
</script>
</body></html>
